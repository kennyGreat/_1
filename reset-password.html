<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Reset Password - DataBulge</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#111;-webkit-text-size-adjust:100%;}
body{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#0f2952 0%,#1a3a72 50%,#1A56DB 100%);padding:22px 16px;}
.box{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:28px 22px 24px;-webkit-box-shadow:0 18px 44px rgba(0,0,0,.22);box-shadow:0 18px 44px rgba(0,0,0,.22);}
.brand{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;gap:11px;margin-bottom:20px;}
.logo{width:44px;height:44px;border-radius:12px;background:#1A56DB;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;overflow:hidden;-webkit-flex-shrink:0;flex-shrink:0;}
.logo img{width:100%;height:100%;-o-object-fit:cover;object-fit:cover;}
.brand-text h1{font-size:1.22rem;font-weight:900;letter-spacing:-.02em;margin-bottom:2px;}
.brand-text p{font-size:.82rem;color:#666;line-height:1.4;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.78rem;font-weight:800;color:#555;margin-bottom:5px;}
.field input{display:block;width:100%;height:46px;border:1.5px solid #E1E5EF;border-radius:12px;background:#FBFCFF;padding:0 13px;font-size:.97rem;color:#111;outline:none;-webkit-appearance:none;}
.field input:focus{border-color:#1A56DB;-webkit-box-shadow:0 0 0 3px rgba(26,86,219,.10);box-shadow:0 0 0 3px rgba(26,86,219,.10);}
.btn{display:block;width:100%;height:48px;border:none;border-radius:12px;margin-top:18px;background:#1A56DB;color:#fff;font-weight:900;font-size:.97rem;cursor:pointer;-webkit-appearance:none;}
.btn:disabled{opacity:.65;cursor:default;}
.msg{display:none;margin-top:14px;border-radius:12px;padding:11px 13px;font-size:.83rem;line-height:1.5;}
.msg.err{display:block;background:#fff2f2;border:1px solid #f5c6cb;color:#b42318;}
.msg.ok{display:block;background:#eaf5ee;border:1px solid #b7dec2;color:#26733c;}
.back{font-size:.8rem;color:#888;text-align:center;margin-top:16px;}
.back a,.back button{color:#1A56DB;font-weight:800;text-decoration:none;background:none;border:none;cursor:pointer;font-size:inherit;font-family:inherit;padding:0;}
.spinner{display:none;text-align:center;padding:30px 0;color:#888;font-size:.88rem;}
.spinner.on{display:block;}
.fields{display:none;}
.fields.on{display:block;}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="logo"><img src="playstore-icon.png" alt="DataBulge"></div>
    <div class="brand-text">
      <h1>Change Password</h1>
      <p>Enter a new password for your account.</p>
    </div>
  </div>

  <div class="spinner on" id="spinner">Verifying reset link&hellip;</div>

  <div class="fields" id="fields">
    <div class="field">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" placeholder="Repeat new password" autocomplete="new-password">
    </div>
    <button class="btn" id="saveBtn" type="button">Save Password</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="back"><a href="databulge-auth.html">&#8592; Back to login</a></div>
</div>

<script>
/* ── Constants ── */
var SUPA_URL = 'https://dplxnpxxztkjczaoyetl.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwbHhucHh4enRramN6YW95ZXRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzEwNTUsImV4cCI6MjA4ODU0NzA1NX0.Vhxv9UieuHwm4BBF9ziXPp8f5jeyka4m9sZbcQ_VlRQ';
var AUTH     = SUPA_URL + '/auth/v1';

var gAccessToken  = '';
var gRefreshToken = '';

/* ── Helpers ── */
function $(id) { return document.getElementById(id); }

function show(type, text) {
  var m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = text;
}

function setReady() {
  $('spinner').className = 'spinner';
  $('fields').className  = 'fields on';
  $('newPassword').focus();
}

function setFatal(text) {
  $('spinner').className = 'spinner';
  show('err', text);
}

/* ── XHR helper (ES5, no fetch) ── */
function xhr(method, url, headers, body, cb) {
  var req = new XMLHttpRequest();
  req.open(method, url, true);
  req.timeout = 15000;
  var k;
  for (k in headers) {
    if (headers.hasOwnProperty(k)) req.setRequestHeader(k, headers[k]);
  }
  req.onreadystatechange = function() {
    if (req.readyState !== 4) return;
    var data = null;
    try { data = JSON.parse(req.responseText); } catch(e) { data = req.responseText; }
    cb(req.status < 200 || req.status >= 300, { status: req.status, ok: req.status >= 200 && req.status < 300, data: data });
  };
  req.onerror   = function() { cb(true, null); };
  req.ontimeout = function() { cb(true, null); };
  req.send(body || null);
}

/* ── URL parsers ── */
function parseHash() {
  var out = {};
  var h = (window.location.hash || '').replace(/^#/, '');
  if (!h) return out;
  var pairs = h.split('&');
  var i, eq;
  for (i = 0; i < pairs.length; i++) {
    eq = pairs[i].indexOf('=');
    if (eq > -1) {
      try {
        out[decodeURIComponent(pairs[i].slice(0, eq))] = decodeURIComponent(pairs[i].slice(eq + 1));
      } catch(e) {}
    }
  }
  return out;
}

function parseQuery() {
  var out = {};
  var q = (window.location.search || '').replace(/^\?/, '');
  if (!q) return out;
  var pairs = q.split('&');
  var i, eq;
  for (i = 0; i < pairs.length; i++) {
    eq = pairs[i].indexOf('=');
    if (eq > -1) {
      try {
        out[decodeURIComponent(pairs[i].slice(0, eq))] = decodeURIComponent(pairs[i].slice(eq + 1));
      } catch(e) {}
    }
  }
  return out;
}

/* ── Session bootstrap ──
   Supabase can deliver the reset token two ways:
   1. Implicit flow:  #access_token=...&type=recovery
   2. PKCE flow:      ?code=...  (must exchange for session)
   We handle both. The token is also stored to localStorage so the
   Android WebView can pick it up if the page is loaded via deep link.
── */
function bootstrap() {
  var hash  = parseHash();
  var query = parseQuery();

  /* ── Case 1: hash token (implicit flow) ── */
  if (hash.type === 'recovery' && hash.access_token) {
    gAccessToken  = hash.access_token;
    gRefreshToken = hash.refresh_token || '';
    /* Strip the hash from the URL bar so the token isn't re-used on refresh */
    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}
    persistTokens();
    setReady();
    return;
  }

  /* ── Case 2: PKCE code exchange ── */
  if (query.code) {
    var code = query.code;
    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}
    xhr('POST', AUTH + '/token?grant_type=pkce',
      { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
      JSON.stringify({ auth_code: code }),
      function(err, res) {
        if (err || !res || !res.ok || !res.data || !res.data.access_token) {
          setFatal('Reset link is invalid or expired. Please request a new one.');
          return;
        }
        gAccessToken  = res.data.access_token;
        gRefreshToken = res.data.refresh_token || '';
        persistTokens();
        setReady();
      }
    );
    return;
  }

  /* ── Case 3: Android deep link injected tokens into localStorage ──
     MainActivity calls injectResetTokens() after WebView load.
     We wait up to 1.5s for it. ── */
  var waited = 0;
  var poll = setInterval(function() {
    var at = safeLS('get', '__db_recov_at__');
    var rt = safeLS('get', '__db_recov_rt__');
    if (at) {
      clearInterval(poll);
      gAccessToken  = at;
      gRefreshToken = rt || '';
      safeLS('del', '__db_recov_at__');
      safeLS('del', '__db_recov_rt__');
      setReady();
      return;
    }
    waited += 100;
    if (waited >= 1500) {
      clearInterval(poll);
      setFatal('No reset session found. Please tap the link in your email again, or request a new one.');
    }
  }, 100);
}

function persistTokens() {
  /* Store so Android WebView bridge can confirm session after save */
  safeLS('set', '__db_recov_at__', gAccessToken);
  safeLS('set', '__db_recov_rt__', gRefreshToken);
}

function safeLS(op, key, val) {
  try {
    if (op === 'get') return localStorage.getItem(key);
    if (op === 'set') { localStorage.setItem(key, val); }
    if (op === 'del') { localStorage.removeItem(key); }
  } catch(e) {}
  return null;
}

/* ── Save password ── */
function savePassword() {
  var btn     = $('saveBtn');
  var pass    = ($('newPassword').value    || '').replace(/^\s+|\s+$/g, '');
  var confirm = ($('confirmPassword').value || '').replace(/^\s+|\s+$/g, '');

  if (pass.length < 6) { show('err', 'Password must be at least 6 characters.'); return; }
  if (pass !== confirm) { show('err', 'Passwords do not match.'); return; }
  if (!gAccessToken)    { show('err', 'Reset session expired. Please request a new link.'); return; }

  btn.disabled    = true;
  btn.textContent = 'Saving\u2026';
  show('', '');

  xhr('PUT', AUTH + '/user',
    { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + gAccessToken, 'Content-Type': 'application/json' },
    JSON.stringify({ password: pass }),
    function(err, res) {
      if (err || !res || !res.ok) {
        btn.disabled    = false;
        btn.textContent = 'Save Password';
        var d  = res && res.data;
        var ec = (d && (d.error_code || d.error || '')) || '';
        var em = (d && (d.message || d.msg || '')) || '';
        if (ec.indexOf('expired') !== -1 || ec.indexOf('invalid') !== -1 ||
            em.indexOf('expired') !== -1  || em.indexOf('invalid') !== -1) {
          show('err', 'Reset link has expired. Please go back and request a new one.');
        } else {
          show('err', em || ec || 'Failed to update password. Please request a new reset link.');
        }
        return;
      }

      /* Password saved — now refresh the session so the user is immediately logged in */
      show('ok', '\u2705 Password updated! Signing you in\u2026');
      safeLS('del', '__db_recov_at__');
      safeLS('del', '__db_recov_rt__');

      if (gRefreshToken) {
        xhr('POST', AUTH + '/token?grant_type=refresh_token',
          { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
          JSON.stringify({ refresh_token: gRefreshToken }),
          function(err2, res2) {
            var at2 = res2 && res2.data && res2.data.access_token;
            var rt2 = res2 && res2.data && res2.data.refresh_token;
            if (!err2 && at2) {
              /* Store fresh session so databulge-auth.html picks it up on redirect */
              safeLS('set', '__db_session_at__', at2);
              safeLS('set', '__db_session_rt__', rt2 || '');
              safeLS('set', '__db_session_exp__', String(Date.now() + ((res2.data.expires_in || 3600) * 1000)));
            }
            redirectToLogin();
          }
        );
      } else {
        redirectToLogin();
      }
    }
  );
}

function redirectToLogin() {
  setTimeout(function() {
    /* Determine the correct auth page path */
    var base = window.location.href.split('?')[0].split('#')[0];
    var dir  = base.replace(/\/[^\/]*$/, '/');
    var target;
    if (base.indexOf('file://') === 0 || base.indexOf('file:///android_asset') === 0) {
      target = 'file:///android_asset/databulge-auth.html';
    } else {
      target = dir + 'databulge-auth.html';
    }
    window.location.href = target;
  }, 1400);
}

/* ── Wire up ── */
window.addEventListener('load', function() { bootstrap(); });
$('saveBtn').addEventListener('click', savePassword);
$('confirmPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) savePassword();
});
$('newPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) $('confirmPassword').focus();
});
</script>
</body>
</html>
