<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Reset Password — DataBulge</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#111;-webkit-text-size-adjust:100%;}
body{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#0f2952 0%,#1a3a72 50%,#1A56DB 100%);padding:22px 16px;}
.box{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:28px 22px 24px;-webkit-box-shadow:0 18px 44px rgba(0,0,0,.22);box-shadow:0 18px 44px rgba(0,0,0,.22);}

/* Brand */
.brand{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;gap:12px;margin-bottom:22px;}
.logo-svg{width:44px;height:44px;-webkit-flex-shrink:0;flex-shrink:0;}
.brand-text h1{font-size:1.18rem;font-weight:900;letter-spacing:-.02em;margin-bottom:2px;}
.brand-text p{font-size:.82rem;color:#666;line-height:1.4;}

/* Form */
.field{margin-bottom:14px;}
.field label{display:block;font-size:.78rem;font-weight:800;color:#555;margin-bottom:5px;}
.pw-wrap{position:relative;}
.field input{display:block;width:100%;height:46px;border:1.5px solid #E1E5EF;border-radius:12px;background:#FBFCFF;padding:0 42px 0 13px;font-size:.97rem;color:#111;outline:none;-webkit-appearance:none;}
.field input:focus{border-color:#1A56DB;-webkit-box-shadow:0 0 0 3px rgba(26,86,219,.10);box-shadow:0 0 0 3px rgba(26,86,219,.10);}
.eye{position:absolute;right:11px;top:50%;margin-top:-11px;background:none;border:none;cursor:pointer;font-size:.95rem;padding:2px;color:#888;line-height:1;}
.strength{font-size:.72rem;font-weight:700;margin-top:5px;min-height:16px;}

/* Buttons */
.btn{display:block;width:100%;height:48px;border:none;border-radius:12px;margin-top:18px;background:#3d9758;color:#fff;font-weight:900;font-size:.97rem;cursor:pointer;-webkit-appearance:none;-webkit-transition:opacity .15s;transition:opacity .15s;}
.btn:disabled{opacity:.65;cursor:default;}
.btn:active:not(:disabled){opacity:.82;}

/* Messages */
.msg{display:none;margin-top:14px;border-radius:12px;padding:11px 13px;font-size:.83rem;line-height:1.55;}
.msg.err{display:block;background:#fff2f2;border:1px solid #f5c6cb;color:#b42318;}
.msg.ok {display:block;background:#eaf5ee;border:1px solid #b7dec2;color:#26733c;}

/* States */
.spinner{text-align:center;padding:28px 0;color:#888;font-size:.88rem;}
.fields{display:none;}
.fields.on{display:block;}

/* Back link */
.back{font-size:.8rem;color:#888;text-align:center;margin-top:16px;}
.back a,.back button{color:#1A56DB;font-weight:800;text-decoration:none;background:none;border:none;cursor:pointer;font-size:inherit;font-family:inherit;padding:0;}
</style>
</head>
<body>
<div class="box">

  <!-- Brand — SVG logo, no external image dependency -->
  <div class="brand">
    <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DataBulge">
      <circle cx="50" cy="50" r="50" fill="#1A56DB"/>
      <circle cx="50" cy="54" r="22" fill="#fff" opacity=".15"/>
      <rect x="35" y="58" width="5" height="11" rx="2" fill="#fff"/>
      <rect x="43" y="52" width="5" height="17" rx="2" fill="#fff"/>
      <rect x="51" y="45" width="5" height="24" rx="2" fill="#fff"/>
      <rect x="59" y="38" width="5" height="31" rx="2" fill="#fff"/>
      <circle cx="27" cy="68" r="4" fill="#1A56DB" opacity=".7"/>
    </svg>
    <div class="brand-text">
      <h1>Set New Password</h1>
      <p>Enter a strong password for your DataBulge account.</p>
    </div>
  </div>

  <!-- Spinner shown while token is being verified -->
  <div class="spinner" id="spinner">Verifying reset link&hellip;</div>

  <!-- Password form — shown once token is confirmed valid -->
  <div class="fields" id="fields">
    <div class="field">
      <label for="newPassword">New password</label>
      <div class="pw-wrap">
        <input id="newPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password">
        <button type="button" class="eye" id="eye1" onclick="toggleEye('newPassword','eye1')">&#128065;</button>
      </div>
      <div class="strength" id="strength"></div>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <div class="pw-wrap">
        <input id="confirmPassword" type="password" placeholder="Repeat your new password" autocomplete="new-password">
        <button type="button" class="eye" id="eye2" onclick="toggleEye('confirmPassword','eye2')">&#128065;</button>
      </div>
    </div>
    <button class="btn" id="saveBtn" type="button">Save New Password</button>
  </div>

  <div class="msg" id="msg"></div>
  <div class="back"><a href="databulge-auth.html">&#8592; Back to sign in</a></div>

</div>
<script>
'use strict';

/* ── Config ── */
var SUPA_URL = 'https://dplxnpxxztkjczaoyetl.supabase.co';
var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwbHhucHh4enRramN6YW95ZXRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzEwNTUsImV4cCI6MjA4ODU0NzA1NX0.Vhxv9UieuHwm4BBF9ziXPp8f5jeyka4m9sZbcQ_VlRQ';
var AUTH     = SUPA_URL + '/auth/v1';

/* ── State ── */
var gAccessToken  = '';
var gRefreshToken = '';

/* ── DOM helpers ── */
function $(id) { return document.getElementById(id); }

function showMsg(type, text) {
  var m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = text;
}

function setReady() {
  $('spinner').style.display = 'none';
  $('fields').className = 'fields on';
  $('newPassword').focus();
}

function setFatal(html) {
  $('spinner').style.display = 'none';
  var m = $('msg');
  m.className = 'msg err';
  m.innerHTML = html;
}

function toggleEye(inputId, btnId) {
  var inp = $(inputId), btn = $(btnId);
  if (!inp) return;
  inp.type = (inp.type === 'password') ? 'text' : 'password';
  if (btn) btn.innerHTML = (inp.type === 'password') ? '&#128065;' : '&#128064;';
}

/* ── Password strength ── */
function checkStrength(val) {
  var el = $('strength');
  if (!el) return;
  if (!val) { el.textContent = ''; el.style.color = ''; return; }
  var score = 0;
  if (val.length >= 8)           score++;
  if (val.length >= 12)          score++;
  if (/[A-Z]/.test(val))         score++;
  if (/[0-9]/.test(val))         score++;
  if (/[^A-Za-z0-9]/.test(val))  score++;
  var labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very strong'];
  var colors = ['', '#dc2626', '#d97706', '#2563eb', '#16a34a', '#065f46'];
  el.textContent = labels[score] || '';
  el.style.color = colors[score] || '';
}

/* ── XHR (ES5, Android 4.4 safe) ── */
function xhr(method, url, headers, body, cb) {
  var req = new XMLHttpRequest();
  req.open(method, url, true);
  req.timeout = 15000;
  var k;
  for (k in headers) {
    if (Object.prototype.hasOwnProperty.call(headers, k)) req.setRequestHeader(k, headers[k]);
  }
  req.onreadystatechange = function() {
    if (req.readyState !== 4) return;
    var data = null;
    try { data = JSON.parse(req.responseText); } catch(e) { data = req.responseText; }
    cb(req.status < 200 || req.status >= 300,
       { status: req.status, ok: req.status >= 200 && req.status < 300, data: data });
  };
  req.onerror   = function() { cb(true, null); };
  req.ontimeout = function() { cb(true, null); };
  req.send(body || null);
}

/* ── Safe localStorage wrapper ── */
function safeLS(op, key, val) {
  try {
    if (op === 'get') return localStorage.getItem(key);
    if (op === 'set') localStorage.setItem(key, val);
    if (op === 'del') localStorage.removeItem(key);
  } catch(e) {}
  return null;
}

/* ── Write session in the exact format databulge_final.html expects ──
   _setSession() in main app stores: { at, rt, ex, user }
   under the key 'db_sess'
── */
function writeMainAppSession(at, rt, expiresIn, user) {
  var ex = Date.now() + ((parseInt(expiresIn, 10) || 3600) * 1000);
  var sess = JSON.stringify({ at: at, rt: rt, ex: ex, user: user || null });
  try {
    localStorage.setItem('db_sess', sess);
    try { sessionStorage.setItem('db_sess', sess); } catch(e) {}
  } catch(e) {}
}

/* ── URL parsers ── */
function parseHash() {
  var out = {}, h = (window.location.hash || '').replace(/^#/, '');
  if (!h) return out;
  h.split('&').forEach(function(p) {
    var eq = p.indexOf('=');
    if (eq > -1) {
      try { out[decodeURIComponent(p.slice(0, eq))] = decodeURIComponent(p.slice(eq + 1)); } catch(e) {}
    }
  });
  return out;
}

function parseQuery() {
  var out = {}, q = (window.location.search || '').replace(/^\?/, '');
  if (!q) return out;
  q.split('&').forEach(function(p) {
    var eq = p.indexOf('=');
    if (eq > -1) {
      try { out[decodeURIComponent(p.slice(0, eq))] = decodeURIComponent(p.slice(eq + 1)); } catch(e) {}
    }
  });
  return out;
}

/* ── Session bootstrap ──
   Supabase delivers the reset token three ways:
   1. Implicit flow (web):  URL hash  #access_token=...&type=recovery
   2. PKCE flow (native):   URL query ?code=...  (exchange for session)
   3. Android deep link:    MainActivity injects tokens into localStorage
      under __db_recov_at__ / __db_recov_rt__ after the WebView loads.
── */
function bootstrap() {
  var hash  = parseHash();
  var query = parseQuery();

  /* ── Case 1: Implicit flow hash token ── */
  if (hash.type === 'recovery' && hash.access_token) {
    gAccessToken  = hash.access_token;
    gRefreshToken = hash.refresh_token || '';
    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}
    setReady();
    return;
  }

  /* ── Case 2: PKCE code ── */
  if (query.code) {
    var code = query.code;
    try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}
    /* PKCE exchange requires code_verifier stored during sign-in — since DataBulge
       uses implicit flow there is no verifier. Attempt the exchange anyway; if it
       fails (missing verifier) show a friendly error so user can request a new link. */
    xhr('POST', AUTH + '/token?grant_type=pkce',
      { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
      JSON.stringify({ auth_code: code }),
      function(err, res) {
        if (!err && res && res.ok && res.data && res.data.access_token) {
          gAccessToken  = res.data.access_token;
          gRefreshToken = res.data.refresh_token || '';
          setReady();
        } else {
          setFatal('This reset link has expired or is invalid. <br><a href="databulge-auth.html">Request a new one &rarr;</a>');
        }
      }
    );
    return;
  }

  /* ── Case 3: Android deep link — poll localStorage for injected tokens ── */
  var waited = 0;
  var poll = setInterval(function() {
    var at = safeLS('get', '__db_recov_at__');
    var rt = safeLS('get', '__db_recov_rt__');
    if (at) {
      clearInterval(poll);
      gAccessToken  = at;
      gRefreshToken = rt || '';
      safeLS('del', '__db_recov_at__');
      safeLS('del', '__db_recov_rt__');
      setReady();
      return;
    }
    waited += 100;
    if (waited >= 1500) {
      clearInterval(poll);
      setFatal('No reset session found. Please tap the link in your email again, or <a href="databulge-auth.html">request a new one &rarr;</a>');
    }
  }, 100);
}

/* ── Save password ── */
function savePassword() {
  var btn     = $('saveBtn');
  var pass    = ($('newPassword').value    || '').replace(/^\s+|\s+$/g, '');
  var confirm = ($('confirmPassword').value || '').replace(/^\s+|\s+$/g, '');

  showMsg('', '');

  /* Validation — must match Supabase password policy (min 8 chars) */
  if (pass.length < 8) {
    showMsg('err', 'Password must be at least 8 characters.'); return;
  }
  if (pass !== confirm) {
    showMsg('err', 'Passwords do not match.'); return;
  }
  if (!gAccessToken) {
    showMsg('err', 'Reset session expired. Please request a new link.'); return;
  }

  btn.disabled    = true;
  btn.textContent = 'Saving\u2026';

  xhr('PUT', AUTH + '/user',
    { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + gAccessToken, 'Content-Type': 'application/json' },
    JSON.stringify({ password: pass }),
    function(err, res) {
      if (err || !res || !res.ok) {
        btn.disabled    = false;
        btn.textContent = 'Save New Password';
        var d   = res && res.data;
        var ec  = String((d && (d.error_code || d.error)) || '').toLowerCase();
        var em  = String((d && (d.message || d.msg))     || '').toLowerCase();
        var expired = ec.indexOf('expir') !== -1 || ec.indexOf('invalid') !== -1 ||
                      em.indexOf('expir') !== -1 || em.indexOf('invalid') !== -1;
        if (expired) {
          showMsg('err', 'Reset link has expired. Please request a new one from the sign-in page.');
        } else {
          showMsg('err', (d && (d.message || d.error)) || 'Failed to update password. Please try again.');
        }
        return;
      }

      /* ── Password saved successfully ── */
      showMsg('ok', '\u2705 Password updated! Signing you in\u2026');
      $('newPassword').value    = '';
      $('confirmPassword').value = '';
      btn.textContent = 'Saved!';

      /* Exchange recovery refresh_token for a fresh full session,
         then write it to 'db_sess' so databulge_final.html logs
         the user in automatically without asking them to sign in again. */
      if (gRefreshToken) {
        xhr('POST', AUTH + '/token?grant_type=refresh_token',
          { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
          JSON.stringify({ refresh_token: gRefreshToken }),
          function(err2, res2) {
            var at2  = res2 && res2.data && res2.data.access_token;
            var rt2  = res2 && res2.data && res2.data.refresh_token;
            var exp2 = res2 && res2.data && res2.data.expires_in;
            var user = res2 && res2.data && res2.data.user;
            if (!err2 && at2) {
              /* Write session in the exact format the main app reads */
              writeMainAppSession(at2, rt2 || '', exp2 || 3600, user || null);
            }
            redirectToApp();
          }
        );
      } else {
        /* No refresh token — user will just sign in manually */
        redirectToApp();
      }
    }
  );
}

/* ── After save: go back to the main app.
   If a fresh session was written, the main app will auto-login.
   Otherwise it shows the sign-in screen. ── */
function redirectToApp() {
  setTimeout(function() {
    var base   = window.location.href.split('?')[0].split('#')[0];
    var dir    = base.replace(/\/[^\/]*$/, '/');
    var target;
    if (base.indexOf('file://') === 0 || base.indexOf('file:///android_asset') === 0) {
      /* Android APK WebView */
      target = 'file:///android_asset/databulge-auth.html';
    } else {
      /* Web — go back to main app (index.html or databulge.html depending on repo) */
      target = dir + 'databulge-auth.html';
    }
    window.location.href = target;
  }, 1500);
}

/* ── Wire up ── */
window.addEventListener('load', function() { bootstrap(); });

$('saveBtn').addEventListener('click', savePassword);

$('newPassword').addEventListener('input', function() {
  checkStrength(this.value);
});
$('newPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) $('confirmPassword').focus();
});
$('confirmPassword').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) savePassword();
});
</script>
</body>
</html>
