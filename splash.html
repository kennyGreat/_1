<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>
<title>DataBulge Splash</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
}
body{
  background:linear-gradient(
    160deg,
    #0f2952 0%,
    #1a3a72 48%,
    #1A56DB 100%
  );
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}
/* Signal bar breathing animation */
@keyframes sbreathe{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:.55;
  }
}
.sb1{
  animation:sbreathe 1.8s ease-in-out 0s infinite;
}
.sb2{
  animation:sbreathe 1.8s ease-in-out .2s infinite;
}
.sb3{
  animation:sbreathe 1.8s ease-in-out .4s infinite;
}
.sb4{
  animation:sbreathe 1.8s ease-in-out .6s infinite;
}
</style>
</head>
<body>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 360 230"
  width="320"
  style="max-width:85vw;"
  role="img"
  aria-label="DataBulge"
>
  <!-- Glow -->
  <circle cx="180" cy="58" r="50" fill="#FFFFFF" opacity=".15"/>
  <circle cx="180" cy="58" r="40" fill="#FFFFFF"/>
  <!-- Logo -->
  <circle cx="180" cy="58" r="27" fill="#1A56DB"/>
  <!-- Signal Bars -->
  <rect x="161" y="63" width="8" height="15" rx="3" fill="#FFFFFF" class="sb1"/>
  <rect x="173" y="55" width="8" height="23" rx="3" fill="#FFFFFF" class="sb2"/>
  <rect x="185" y="45" width="8" height="33" rx="3" fill="#FFFFFF" class="sb3"/>
  <rect x="197" y="36" width="8" height="42" rx="3" fill="#FFFFFF" class="sb4"/>
  <!-- Dot -->
  <circle cx="144" cy="82" r="5" fill="#FFFFFF"/>
  <!-- Text -->
  <text
    x="180"
    y="140"
    text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif"
    font-size="38"
    font-weight="300"
    fill="#FFFFFF"
    opacity=".94"
  >
    data
  </text>
  <text
    x="180"
    y="182"
    text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif"
    font-size="42"
    font-weight="900"
    fill="#FFFFFF"
  >
    bulge
  </text>
  <!-- Updated slogan -->
  <text
    x="180"
    y="212"
    text-anchor="middle"
    font-family="Arial,Helvetica,sans-serif"
    font-size="9"
    font-weight="700"
    fill="#FFFFFF"
    opacity=".70"
    letter-spacing="1.2"
  >
    START SMALL. STAY CONNECTED
  </text>
</svg>
<script>
/* ──────────────────────────────────────────────────────────────
   DataBulge splash — session router
   The whole app uses ONE session key: "db_sess" (written by
   _setSession() in databulge-auth.html and index.html). The splash
   reads that exact key and routes:
       valid session  -> index.html        (main app)
       no session      -> databulge-auth.html
   ES5 only — must work on Android 4.4 WebView.
─────────────────────────────────────────────────────────────── */
(function () {
  var MAIN_APP = 'index.html';
  var AUTH     = 'databulge-auth.html';

  function hasValidSession() {
    try {
      var raw = localStorage.getItem('db_sess');
      if (!raw) return false;
      var s = JSON.parse(raw);
      if (!s || !s.at) return false;
      /* If an expiry is stored, honour it (allow small clock skew).
         If no expiry is stored, treat the presence of a token as valid
         and let the main app validate/refresh it. */
      if (s.ex && s.ex < (Date.now() - 5000)) return false;
      return true;
    } catch (e) {
      return false;
    }
  }

  setTimeout(function () {
    if (hasValidSession()) {
      window.location.replace(MAIN_APP);
    } else {
      window.location.replace(AUTH);
    }
  }, 3000);
})();
</script>
</body>
</html>
