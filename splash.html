<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataBulge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
body{
  background:linear-gradient(160deg,#0f2952 0%,#1a3a72 48%,#1A56DB 100%);
  display:flex;align-items:center;justify-content:center;
  height:100vh;
}
@keyframes sbreathe{0%,100%{opacity:1;}50%{opacity:.55;}}
.sb1{animation:sbreathe 1.8s ease-in-out 0s infinite;}
.sb2{animation:sbreathe 1.8s ease-in-out .2s infinite;}
.sb3{animation:sbreathe 1.8s ease-in-out .4s infinite;}
.sb4{animation:sbreathe 1.8s ease-in-out .6s infinite;}
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="320" style="max-width:85vw;" role="img" aria-label="DataBulge">
    <circle cx="180" cy="58" r="50" fill="#FFFFFF" opacity=".15"/>
    <circle cx="180" cy="58" r="40" fill="#FFFFFF"/>
    <circle cx="180" cy="58" r="27" fill="#1A56DB"/>
    <rect x="161" y="63" width="8" height="15" rx="3" fill="#FFFFFF" class="sb1"/>
    <rect x="173" y="55" width="8" height="23" rx="3" fill="#FFFFFF" class="sb2"/>
    <rect x="185" y="45" width="8" height="33" rx="3" fill="#FFFFFF" class="sb3"/>
    <rect x="197" y="36" width="8" height="42" rx="3" fill="#FFFFFF" class="sb4"/>
    <circle cx="144" cy="82" r="5" fill="#FFFFFF"/>
    <text x="180" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="300" fill="#FFFFFF" opacity=".94">data</text>
    <text x="180" y="182" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" fill="#FFFFFF">bulge</text>
    <text x="180" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" opacity=".55" letter-spacing="1.8">DATA ON YOUR OWN TERMS</text>
  </svg>
<script>
  /*
    Session check — reads localStorage keys Supabase writes automatically.
    Valid session (logged in or Remember Me ticked) → main app.
    No session or expired → auth page.
    Duration: random 5–7 seconds either way.
  */
  function getDestination() {
    try {
      var keys = Object.keys(localStorage);
      for (var i = 0; i < keys.length; i++) {
        if (keys[i].indexOf('supabase.auth.token') !== -1 ||
            keys[i].indexOf('sb-') !== -1) {
          var raw = localStorage.getItem(keys[i]);
          if (raw) {
            var data = JSON.parse(raw);
            var session = data.session || data;
            if (session && session.access_token) {
              var expiresAt = session.expires_at;
              var nowSecs = Math.floor(Date.now() / 1000);
              if (!expiresAt || expiresAt > nowSecs) {
                // Valid session — go to main app
                return 'https://www.databulge.com/databulge.html';
              }
            }
          }
        }
      }
    } catch(e) {}
    // No valid session — go to auth
    return 'https://www.databulge.com/databulge-auth.html';
  }

  var duration = Math.floor(Math.random() * 2000) + 5000; // 5–7 seconds
  setTimeout(function(){
    window.location.replace(getDestination());
  }, duration);
</script>
</body>
</html>
